[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "greatminds"
version = "2.2.0"
description = "File-based Claude/Codex agent coordination with queues, driven roles, registered Ansible stand leases, and evidence gates"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Groshenkov", email = "kir.groshenkov@gmail.com" }]
keywords = ["multi-agent", "coordination", "claude-code", "codex", "agents", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.1",
  # inotify-driven coordd wake. Linux-only; on non-Linux hosts the
  # optional import in cli/coordd.py degrades gracefully back to polling.
  'inotify_simple>=2.0; platform_system == "Linux"',
  # coordd's PyPI auto-update check uses packaging.version.parse for
  # PEP 440 ordering; packaging is a direct dependency by design.
  "packaging>=21.0",
  # ansible-core powers the YAML stand-profile execution path
  # (cli/stand_executor.py:execute_yaml_profile).
  "ansible-core>=2.16,<2.18",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7,<10",
  "mkdocs-click>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/veryviolet/greatminds"
Repository = "https://github.com/veryviolet/greatminds"
Issues = "https://github.com/veryviolet/greatminds/issues"
Documentation = "https://veryviolet.github.io/greatminds/"

[project.scripts]
# Single unified entry-point. All commands are subcommands of `greatminds`:
#   greatminds task list verified
#   greatminds inbox send DEVELOPER --kind wake
#   greatminds launch --target tmux
#   greatminds coordd --verbose
# See `greatminds --help` for the full list.
greatminds = "greatminds.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/greatminds"]

[tool.hatch.build.targets.wheel.force-include]
# Package data (plugins, mcp configs, codex profiles, templates, role docs, schema)
# lives under src/greatminds/data/ and is shipped with the wheel verbatim.

[tool.hatch.build.targets.sdist]
include = [
  "src/greatminds",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

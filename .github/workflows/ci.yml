name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build wheel + smoke-test entry-points
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        run: pip install --quiet uv

      - name: set up node for VS Code extension tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: build wheel + sdist
        run: uv build

      - name: install wheel into clean venv
        run: |
          uv venv .venv-test --python ${{ matrix.python-version }} --seed
          .venv-test/bin/pip install --quiet dist/*.whl

      - name: smoke — every greatminds subcommand has --help
        run: |
          set -e
          .venv-test/bin/greatminds --help > /dev/null
          subs="$(.venv-test/bin/python -c 'from greatminds.cli.main import cli; print(" ".join(sorted(cli.commands)))')"
          for sub in $subs; do
            echo "-- greatminds $sub --help --"
            .venv-test/bin/greatminds "$sub" --help > /dev/null
          done

      - name: smoke — importlib.resources resolves packaged data
        run: |
          .venv-test/bin/python - <<'PY'
          from importlib.resources import files
          data = files("greatminds.data")
          for needed in [
              "schema.yaml",
              "COORDINATE.md",
              "systemd/greatminds-daemon@.service",
              "templates/stand-profiles.yaml",
              "templates/PROJECT.md.template",
          ]:
              assert data.joinpath(needed).is_file(), needed
          print("data resolves OK")
          PY

      - name: smoke — setup scaffolds a fresh project
        run: |
          .venv-test/bin/greatminds setup --project-dir /tmp/gm_ci_test
          test -f /tmp/gm_ci_test/coordination/execution.yaml
          .venv-test/bin/greatminds project execution --config /tmp/gm_ci_test/coordination/execution.yaml > /dev/null
          test -d /tmp/gm_ci_test/.greatminds/feature_inbox
          test ! -e /tmp/gm_ci_test/schema.yaml
          test ! -e /tmp/gm_ci_test/COORDINATE.md
          test ! -e /tmp/gm_ci_test/coord.yaml
          test -f /tmp/gm_ci_test/.greatminds/schema.yaml

      - name: install test deps + run pytest regression suite
        run: |
          .venv-test/bin/pip install --quiet pytest pyyaml 'greatminds[stands]'
          PATH="$PWD/.venv-test/bin:$PATH" .venv-test/bin/pytest tests/ -v

      - name: check generated contract reference against installed wheel
        run: .venv-test/bin/python tools/generate_contract_reference.py --check

      - name: test VS Code extension harness
        run: npm test --prefix vscode-extension

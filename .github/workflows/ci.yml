name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build wheel + smoke-test entry-points
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        run: pip install --quiet uv

      - name: build wheel + sdist
        run: uv build

      - name: install wheel into clean venv
        run: |
          uv venv .venv-test --python ${{ matrix.python-version }} --seed
          .venv-test/bin/pip install --quiet dist/*.whl

      - name: smoke — every greatminds subcommand has --help
        run: |
          set -e
          .venv-test/bin/greatminds --help > /dev/null
          subs="$(.venv-test/bin/python -c 'from greatminds.cli.main import cli; print(" ".join(sorted(cli.commands)))')"
          for sub in $subs; do
            echo "-- greatminds $sub --help --"
            .venv-test/bin/greatminds "$sub" --help > /dev/null
          done

      - name: smoke — importlib.resources resolves packaged data
        run: |
          .venv-test/bin/python - <<'PY'
          from importlib.resources import files
          data = files("greatminds.data")
          for needed in [
              "schema.yaml",
              "COORDINATE.md",
              "bootstrap.md",
              "codex/profiles/developer.config.toml",
              "plugins/coordination-protocol/.claude-plugin/plugin.json",
              "mcp/canon.json",
              "templates/PROJECT.md.template",
          ]:
              assert data.joinpath(needed).is_file(), needed
          print("data resolves OK")
          PY

      - name: smoke — setup scaffolds a fresh project
        run: |
          .venv-test/bin/greatminds setup --project-dir /tmp/gm_ci_test
          test -f /tmp/gm_ci_test/coordination/coord.yaml
          test -f /tmp/gm_ci_test/coordination/PROJECT.md
          test -d /tmp/gm_ci_test/.greatminds/feature_inbox
          test ! -e /tmp/gm_ci_test/schema.yaml
          test ! -e /tmp/gm_ci_test/COORDINATE.md
          test ! -e /tmp/gm_ci_test/coord.yaml
          test -f /tmp/gm_ci_test/.greatminds/schema.yaml
          test -f /tmp/gm_ci_test/.greatminds/COORDINATE.md
          test -f /tmp/gm_ci_test/.greatminds/PROJECT.env

      - name: install test deps + run pytest regression suite
        run: |
          .venv-test/bin/pip install --quiet pytest pyyaml
          .venv-test/bin/pytest tests/ -v

# Coordination pipeline schema
#
# Machine-readable source of truth for queues, roles, transitions, and stand
# profiles. Read by bin/ scripts (render-role, gate_check, wake_check, watchdog,
# lint-tokens) and by humans cross-referencing COORDINATE.md prose.
#
# Invariants in COORDINATE.md must match what's encoded here. If they drift,
# the schema is normative — fix the prose, not the schema.

version: 1

# ---------------------------------------------------------------------------
# Queues
#
# Each queue is a directory under coordination/. Field meanings:
#
#   owner    — role responsible for the queue's content AND the single
#              role that claims from it (moves files out). Location =
#              ownership; ambiguity by content fields (scope, etc.) was
#              removed in the R8 refactor.
#   writers  — roles allowed to write into the queue (own files + add
#              blocks to files they own).
#   kind     — `active` (normal hand-off point), `parking` (waiting on
#              dependencies, e.g. feature_blocked), or `terminal` (end
#              state, e.g. verified / archive).
#
# Authoritative source for OUTGOING moves is the `transitions:` table
# (the `by:` field there names the role allowed to perform each move).
# ---------------------------------------------------------------------------
queues:
  feature_inbox:
    owner: ARCHITECT-PLANNER
    writers: [ARCHITECT-PLANNER, EXPLORER]
    kind: active
    description: Unplanned product work and bug reports from EXPLORER.
  feature_plan:
    owner: ARCHITECT-PLANNER
    writers: [ARCHITECT-PLANNER]
    kind: active
    description: |
      Planned work, owned by ARCHITECT-PLANNER. PLANNER reviews plans
      here and routes to feature_dev / feature_ui_dev / feature_docs
      based on scope. Implementers do NOT claim from feature_plan.
  feature_blocked:
    owner: ARCHITECT-REVIEWER
    writers: [DEVELOPER, UI-DEVELOPER, TECHNICAL-WRITER, TESTER, READER, ARCHITECT-REVIEWER, ARCHITECT-PLANNER]
    kind: parking
    description: Tasks waiting on explicit dependencies. Wake-up by ARCHITECT-REVIEWER.
  feature_dev:
    owner: DEVELOPER
    writers: [DEVELOPER]
    kind: active
    description: Backend implementation.
  feature_ui_dev:
    owner: UI-DEVELOPER
    writers: [UI-DEVELOPER]
    kind: active
    description: UI implementation.
  feature_docs:
    owner: TECHNICAL-WRITER
    writers: [TECHNICAL-WRITER]
    kind: active
    description: Documentation implementation.
  feature_test:
    owner: TESTER
    writers: [DEVELOPER, UI-DEVELOPER, TESTER]
    kind: active
    description: Code ready for test; TESTER moves out.
  feature_docs_review:
    owner: READER
    writers: [TECHNICAL-WRITER, READER]
    kind: active
    description: Docs ready for reader review.
  feature_review:
    owner: ARCHITECT-REVIEWER
    writers: [TESTER, READER, ARCHITECT-REVIEWER]
    kind: active
    description: Final review queue; ARCHITECT-REVIEWER approves or hands back.
  verified:
    owner: ARCHITECT-REVIEWER
    writers: [ARCHITECT-REVIEWER]
    kind: terminal
    description: Approved and committed product work.
  archive:
    owner: ARCHITECT-PLANNER
    writers: [ARCHITECT-PLANNER, ARCHITECT-REVIEWER]
    kind: terminal
    description: Duplicate, abandoned, superseded, or triaged-away product work.
  user_feedback:
    owner: ARCHITECT-PLANNER
    writers: [USER]
    kind: active
    description: Product feedback awaiting triage.
  review_sessions:
    owner: EXPLORER
    writers: [ARCHITECT-PLANNER, EXPLORER]
    kind: active
    description: |
      Scenario B review sessions. EXPLORER owns and claims: iterates
      live-stand exploration, files bugs as feature_inbox entries.
      ARCHITECT-PLANNER writes the initial session file (target,
      scenarios, stand_target) but does NOT claim from this queue.
  # 0247 (0242e / 1.3.0 BREAKING): stand_requests, stand_wip,
  # stand_done queues REMOVED. The lease-based singleton stand
  # resource (schema.stand.resource + .stand/state.yaml) replaces
  # the three-queue model. See 0242 for the full design rationale.
  #
  # 0269: ``.stand`` is the inotify watch path for state.yaml lease
  # lifecycle events (free → preparing → ready → released → free).
  # It is NOT a claim-from queue — STAND-KEEPER's loop reads the
  # state file directly via the lease API. Listing it here lets
  # coordd's ``_owning_role_for_queue`` resolve STAND-KEEPER as the
  # role to wake when state.yaml changes, so a lease acquired by
  # TESTER lands on SK's pane in <1s instead of waiting for SK's
  # next ScheduleWakeup tick (up to 600s).
  .stand:
    owner: STAND-KEEPER
    writers: [STAND-KEEPER, TESTER, ARCHITECT-PLANNER, MAINTAINER]
    kind: state
    description: |
      Singleton stand resource state.yaml + lease bookkeeping.
      coordd watches this dir to wake STAND-KEEPER on lease lifecycle
      events. Not a claim-from queue — no tasks live here.
  bot_inbox:
    owner: BOT-DEVELOPER
    writers: [BOT-USER]
    kind: active
    description: Bot behavior issue awaiting fix.
  bot_wip:
    owner: BOT-DEVELOPER
    writers: [BOT-DEVELOPER]
    kind: active
    description: Bot issue in progress.
  bot_done:
    owner: BOT-USER
    writers: [BOT-DEVELOPER]
    kind: active
    description: Bot fix ready for retest.
  bot_verified:
    owner: BOT-USER
    writers: [BOT-USER]
    kind: terminal
    description: Bot issue verified.
  bot_archive:
    owner: BOT-USER
    writers: [BOT-USER, BOT-DEVELOPER]
    kind: terminal
    description: Archived bot issue.

# ---------------------------------------------------------------------------
# Roles
#
# Each role lists its category, launch modes, heartbeat filename, and the
# queues it may claim from. Roles with `launch_modes` containing `chat` may be
# started without a /loop body for interactive use.
# ---------------------------------------------------------------------------
roles:
  ARCHITECT-PLANNER:
    category: product
    launch_modes: [chat, loop]
    heartbeat: heartbeat.architect-planner
    claims_from: [user_feedback, feature_inbox, feature_plan]
    description: |
      Intake triage, planning (writes plan block, sets stand_required),
      and per-scope routing from feature_plan to feature_dev /
      feature_ui_dev / feature_docs. Interactive chat partner for the
      user. Writes to review_sessions but does not claim from it —
      EXPLORER owns review-session iteration.
  ARCHITECT-REVIEWER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.architect-reviewer
    claims_from: [feature_review, feature_blocked]
    description: |
      Final review with stand-evidence verification (via greatminds gate-check
      result in tests block), commit, push if policy allows. Owns
      feature_blocked wake-up: runs greatminds wake-check at start of each tick.
  DEVELOPER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.developer
    claims_from: [feature_dev]
    description: |
      Backend/product-code implementation. Picks up from feature_dev/
      (placed there by ARCHITECT-PLANNER routing scope:backend tasks).
  UI-DEVELOPER:
    category: product
    launch_modes: [loop, chat]
    heartbeat: heartbeat.ui-developer
    heartbeat_fast: heartbeat.ui-developer.fast
    claims_from: [feature_ui_dev]
    description: |
      UI implementation. Two modes:
      - loop: pipeline mode, claims from feature_ui_dev (placed there by
        ARCHITECT-PLANNER routing scope:ui tasks); writes implementation
        block; hands off to feature_test.
      - chat: scenario C (UI rapid iteration with Vite HMR). Does NOT
        claim from feature_ui_dev; touches heartbeat.ui-developer.fast
        instead of the pipeline heartbeat to avoid contention.
  TECHNICAL-WRITER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.technical-writer
    claims_from: [feature_docs]
    description: |
      Documentation implementation. Picks up from feature_docs/
      (placed there by ARCHITECT-PLANNER routing scope:docs tasks).
  TESTER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.tester
    claims_from: [feature_test]
    description: |
      Tests code on a deployed stand. Before mv to feature_review must
      run greatminds gate-check and record the result in the tests block.
  READER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.reader
    claims_from: [feature_docs_review]
    description: Reads docs as a fresh user; validates clarity and accuracy.
  EXPLORER:
    category: product
    launch_modes: [loop]
    heartbeat: heartbeat.explorer
    claims_from: [review_sessions]
    description: |
      Uses the live system on the stand as a real user (scenario B).
      Files bugs as plan_kind: bugfix tasks in feature_inbox.
  STAND-KEEPER:
    category: service
    launch_modes: [loop]
    heartbeat: heartbeat.stand-keeper
    # 0247: stand_requests queue removed; SK now watches
    # coordination/.stand/state.yaml for lease grants (event-driven
    # via coordd inotify on .stand/).
    claims_from: []
    profiles: [full-deploy, vite-dev]
    description: |
      Owns the singleton stand resource (state.yaml-driven, post-0247).
      Supports two profiles:
      - full-deploy: backend deploy on remote stand (scenarios A, B).
      - vite-dev: backend + Vite dev server with HMR (scenario C).
  USER:
    category: entry
    launch_modes: [chat]
    heartbeat: heartbeat.user
    claims_from: []
    description: |
      Writes user_feedback or initiates ARCHITECT-PLANNER chat. Never
      creates implementation tasks directly.
  MAINTAINER:
    category: system
    launch_modes: [chat]
    heartbeat: heartbeat.maintainer
    claims_from: []
    description: |
      System operator. Handles infrastructure work the product pipeline
      cannot self-heal: agent restart, dead-pid recovery, bin/* and
      schema.yaml maintenance, cutover orchestration, USER chat partner
      for infra topics. Receives asks at inbox/maintainer/ from coordd
      (dead pids, stand-blocked escalation) and from product agents
      when their issue is structural/schema rather than product.
      Does NOT claim from any product queue; does NOT triage user_feedback
      or write plans (that is ARCHITECT-PLANNER's job).
  BOT-USER:
    category: bot
    launch_modes: [loop]
    heartbeat: heartbeat.bot-user
    claims_from: [bot_done, bot_verified]
    description: Bot stream entry; not touched in this refactor.
  BOT-DEVELOPER:
    category: bot
    launch_modes: [loop]
    heartbeat: heartbeat.bot-developer
    claims_from: [bot_inbox]
    description: Bot stream implementer; not touched in this refactor.

# ---------------------------------------------------------------------------
# Transitions
#
# Allowed file moves between queues. The `by` field names the only role
# permitted to perform the move. `requires` lists evidence that must be
# present in the task file (front-matter fields or appended blocks) before
# the move is legal.
# ---------------------------------------------------------------------------
transitions:
  # `requires:` is LOAD-BEARING since task 0103. Each name must have a
  # registered validator in cli/task.py SCHEMA_REQUIRES_VALIDATORS;
  # unknown names raise an error at mv time (no silent documentary
  # keys). The validators run AFTER can_role_move and after the
  # legacy require_target_readiness path — they're additive, not a
  # replacement, so adding a new require name today does not need to
  # retire the existing hardcoded check for it.
  #
  # The hardcoded checks in require_target_readiness still handle
  # block-presence + ready_for_* flags for the standard block kinds
  # (triage, plan, implementation, tests, reader_review) — the
  # registry maps those names to no-op validators that just record
  # them as known. The names that get REAL enforcement at the
  # registry layer:
  #   - gate_check_pass_if_stand_required (re-runs the gate-check
  #     evaluation; TESTER cannot bypass by writing pass into the
  #     field manually).
  - from: user_feedback
    to: feature_inbox
    by: ARCHITECT-PLANNER
    requires: [triage_block]
  - from: user_feedback
    to: archive
    by: ARCHITECT-PLANNER
    requires: [triage_block]
  # PLANNER may archive any task in its own intake/draft area when USER
  # decides not to pursue it (split, deprecated, duplicate, withdrawn).
  - from: feature_inbox
    to: archive
    by: ARCHITECT-PLANNER
    requires: []
  - from: feature_plan
    to: archive
    by: ARCHITECT-PLANNER
    requires: []
  # Task 0102: review_sessions archive requires terminal-state evidence
  # (at least one session_iteration block, or a blocked block whose
  # reason names "withdrawn"/"abandoned"/"obsoleted"). Prevents a
  # single role silently wiping an empty or in-progress session.
  - from: review_sessions
    to: archive
    by: ARCHITECT-PLANNER
    requires: [review_session_terminal_block]
  # F: EXPLORER may self-close its own review session when the review
  # campaign is complete (instead of only signalling PLANNER via inbox).
  - from: review_sessions
    to: archive
    by: EXPLORER
    requires: [review_session_terminal_block]
  # Withdrawal path for in-lifecycle work (task 0100): PLANNER may NOT
  # archive directly from per-scope implementer queues — that silently
  # discards already-written impl/tests/review blocks. The canonical
  # withdraw path is:
  #   1. PLANNER appends a `blocked` block with reason "withdrawn" and
  #      a sentinel `dependencies` that wake-check will never satisfy.
  #   2. PLANNER mv → feature_blocked.
  #   3. ARCHITECT-REVIEWER archives from feature_blocked (the existing
  #      feature_blocked → archive transition by ARCHITECT-REVIEWER).
  # Two roles must agree to terminate in-flight work, never one. The
  # removed transitions used to be:
  #   feature_dev   → archive   by ARCHITECT-PLANNER   requires: []
  #   feature_ui_dev → archive  by ARCHITECT-PLANNER   requires: []
  #   feature_docs   → archive  by ARCHITECT-PLANNER   requires: []
  #   feature_test   → archive  by ARCHITECT-PLANNER   requires: []
  #   feature_review → archive  by ARCHITECT-PLANNER   requires: []
  # REVIEWER may archive blocked tasks that USER decides not to unblock
  # (dependency was retracted, task obsoleted, etc).
  # Task 0102 (3): latest blocked.reason must name a withdrawn-class
  # token; refuses single-role wipe of waiting-but-recoverable work.
  - from: feature_blocked
    to: archive
    by: ARCHITECT-REVIEWER
    requires: [feature_blocked_withdrawn_reason]
  # 0247 (1.3.0): stand_done → archive transition removed alongside
  # the queue. Lease-based stand model has no terminal-queue
  # equivalent — release evidence lands on the product task's
  # tests block directly.
  # Entering feature_plan needs a triage block (the plan block is
  # written IN feature_plan, then it routes OUT to a per-scope queue).
  - from: feature_inbox
    to: feature_plan
    by: ARCHITECT-PLANNER
    requires: [triage_block]
  # ARCHITECT-PLANNER routes from feature_plan into per-scope queues.
  # Location = ownership: once in feature_dev/ it is DEVELOPER's; once
  # in feature_ui_dev/ it is UI-DEVELOPER's; once in feature_docs/ it
  # is TECHNICAL-WRITER's. No claim_filter, no content lookup.
  - from: feature_plan
    to: feature_dev
    by: ARCHITECT-PLANNER
    requires: [plan_block, scope_backend]
  - from: feature_plan
    to: feature_ui_dev
    by: ARCHITECT-PLANNER
    requires: [plan_block, scope_ui]
  - from: feature_plan
    to: feature_docs
    by: ARCHITECT-PLANNER
    requires: [plan_block, scope_docs]
  # Independent READER audit: a `kind: docs` task marked audit-only
  # (plan.audit_only: true) is routed straight to READER's queue, with
  # NO prior TECHNICAL-WRITER write. READER audits reality-vs-docs and
  # records findings in a reader_review block; the audit then flows the
  # normal feature_docs_review exits (→ feature_review, or back so
  # PLANNER spawns a WRITER fix task from the findings).
  - from: feature_plan
    to: feature_docs_review
    by: ARCHITECT-PLANNER
    requires: [plan_block, scope_docs, plan.audit_only]
  - from: feature_dev
    to: feature_test
    by: DEVELOPER
    requires: [implementation_block]
  - from: feature_ui_dev
    to: feature_test
    by: UI-DEVELOPER
    requires: [implementation_block]
  - from: feature_docs
    to: feature_docs_review
    by: TECHNICAL-WRITER
    requires: [implementation_block]
  - from: feature_test
    to: feature_review
    by: TESTER
    requires: [tests_block, gate_check_pass_if_stand_required]
  - from: feature_test
    to: feature_dev
    by: TESTER
    requires: [tests_block_fail_or_partial, scope_backend]
  - from: feature_test
    to: feature_ui_dev
    by: TESTER
    requires: [tests_block_fail_or_partial, scope_ui]
  - from: feature_docs_review
    to: feature_review
    by: READER
    requires: [reader_block_pass]
  - from: feature_docs_review
    to: feature_docs
    by: READER
    requires: [reader_block_fail_or_partial]
  - from: feature_review
    to: verified
    by: ARCHITECT-REVIEWER
    requires: [review_block_approved, gate_check_pass_if_stand_required]
  - from: feature_review
    to: feature_dev
    by: ARCHITECT-REVIEWER
    requires: [review_block_changes_requested, scope_backend]
  - from: feature_review
    to: feature_ui_dev
    by: ARCHITECT-REVIEWER
    requires: [review_block_changes_requested, scope_ui]
  - from: feature_review
    to: feature_docs
    by: ARCHITECT-REVIEWER
    requires: [review_block_changes_requested, scope_docs]
  - from: any_active_queue
    to: feature_blocked
    by: current_owner
    requires: [blocked_block_with_dependencies_and_resume_to]
  - from: feature_blocked
    to: any_resume_to_queue
    by: ARCHITECT-REVIEWER
    requires: [all_dependencies_exist_per_wake_check]
  # 0247 (1.3.0): stand_requests → stand_wip → stand_done transitions
  # removed alongside their queues. State transitions now happen on
  # the singleton stand resource via the lease API
  # (greatminds stand lease/ready/release/down/up) — see
  # schema.stand.resource.transitions.
  # 0195: rollback paths from verified/. Two destinations:
  #   - archive       — "withdraw" (the verified work has been reverted
  #                     at code level; FSM record now matches reality)
  #   - feature_review — "revisit" (REVIEWER decides verified work
  #                     needs further amendment; bounce back for fix)
  # Both gated on a rollback block with non-empty reason — operators
  # must record WHY before the FSM exits verified.
  - from: verified
    to: archive
    by: ARCHITECT-REVIEWER
    requires: [rollback_block_with_reason]
  - from: verified
    to: feature_review
    by: ARCHITECT-REVIEWER
    requires: [rollback_block_with_reason]

# ---------------------------------------------------------------------------
# Task front-matter requirements
#
# Required fields when a task enters a given state (queue). Schema validators
# may read this to lint task files. Inline `*_TEMPLATE.md` snippets in
# templates/coordination/<queue>/_TEMPLATE.md show concrete YAML shape.
# ---------------------------------------------------------------------------
task_kinds:
  product:
    required_initial_fields:
      - id
      - stream            # product
      - kind              # feature | bugfix | docs | ops | research
      - scope             # backend | ui | docs | stand | research
      - reporter
      - opened_at
      - priority
      - title
    plan_block_required_fields:
      - written_by
      - written_at
      - base_commit
      - assignee_role
      - stand_required    # true | false
      - stand_reason
      - plan_kind         # full | bugfix   (new in this refactor)
      - mode              # A | B | C       (new in this refactor)
      - ready_for_implementation
    implementation_block_required_fields:
      - closed_by
      - closed_at
      - base_commit
      - files
      - ready_for_test
    tests_block_required_fields:
      - closed_by
      - closed_at
      - base_commit
      - test_files
      - test_command
      - test_result
      - stand_evidence
      - gate_check_result  # new: pass | fail | missing | n/a
      - gate_check_at      # new: ISO timestamp of greatminds gate-check run
      - gate_check_commit  # new: commit checked against stand evidence
      - ready_for_review
    reader_block_required_fields:
      - reviewed_by
      - reviewed_at
      - outcome
      - docs_checked
      - stand_checked
      - command_or_flow
      - ready_for_architect
    review_block_required_fields:
      - reviewed_by
      - reviewed_at
      - outcome
      - commit
    blocked_block_required_fields:
      - blocked_by
      - blocked_at
      - reason
      - dependencies      # list of "<queue>/<task-id>.md"
      - resume_to         # queue name from this schema
  # 0247 (1.3.0): stand_request task-kind removed. Lease-based
  # singleton stand resource replaces the per-request task-file
  # model; see schema.stand.resource for the new state machine.
  review_session:
    required_initial_fields:
      - id
      - stream            # review_session
      - opened_by
      - opened_at
      - target_functionality
      - scenarios         # list of exploration scenarios
      - stand_target      # host/profile/commit expected
      - mode              # B (scenario B)

# ---------------------------------------------------------------------------
# Stand profiles
#
# Profiles STAND-KEEPER supports. Project-specific commands/URLs live in the
# installed PROJECT.md; here we describe what each profile means.
# ---------------------------------------------------------------------------
stand_profiles:
  full-deploy:
    description: |
      Full backend deployment on the target hosts. Used by scenarios A and B.
      Stand readiness includes service health checks and bootstrap. Triggered
      by stand_requests with request_type in [deploy, restart, rebuild, smoke,
      remote_sync, gpu_check, teardown].
    used_by_scenarios: [A, B]
  vite-dev:
    description: |
      Backend deployed + Vite UI dev server with HMR. Used by scenario C
      (UI rapid iteration). STAND-KEEPER ensures Vite stays up; UI changes
      reload via HMR, no per-change redeploy.
    used_by_scenarios: [C]

# ---------------------------------------------------------------------------
# Scenarios
#
# Three top-level modes of operation. Each task carries `plan.mode: A|B|C`.
# Scenarios are described in prose in COORDINATE.md §6; here only the
# machine-readable mapping to roles and queues.
# ---------------------------------------------------------------------------
scenarios:
  A:
    label: feature_or_refactor
    description: Standard product pipeline with parallel backend/ui/docs work.
    active_roles: [ARCHITECT-PLANNER, ARCHITECT-REVIEWER, DEVELOPER, UI-DEVELOPER, TECHNICAL-WRITER, TESTER, READER, STAND-KEEPER]
    stand_profile: full-deploy
  B:
    label: intensive_review
    description: Review session with EXPLORER on live stand; bug→fast-fix loop.
    active_roles: [ARCHITECT-PLANNER, ARCHITECT-REVIEWER, EXPLORER, DEVELOPER, UI-DEVELOPER, TESTER, STAND-KEEPER]
    stand_profile: full-deploy
  C:
    label: ui_rapid_iteration
    description: Direct chat with UI-DEVELOPER on a Vite-HMR stand.
    active_roles: [UI-DEVELOPER, STAND-KEEPER]
    stand_profile: vite-dev
    notes: |
      UI-DEVELOPER runs in chat mode (heartbeat.ui-developer.fast). Does not
      claim from feature_plan/feature_ui_dev. Optional session-summary task
      may be filed in feature_review at end of session for audit.

# ---------------------------------------------------------------------------
# Watchdog thresholds
#
# Read by greatminds watchdog. Times in seconds.
# ---------------------------------------------------------------------------
watchdog:
  heartbeat_stale_seconds: 600          # 10 min
  intent_orphan_seconds: 300            # 5 min
  task_stale_in_active_queue_seconds: 86400   # 24 h
  task_stale_in_review_queue_seconds: 43200   # 12 h

# ---------------------------------------------------------------------------
# Inbox
#
# Inter-role messaging via per-role inbox/<role>/ mailboxes.
# `allowed_kinds` is the closed set of message kinds the inbox CLI accepts;
# any other value is rejected at send time. Mirrored in COORDINATE.md §10.
# ---------------------------------------------------------------------------
inbox:
  allowed_kinds: [wake, ask, info]

# ---------------------------------------------------------------------------
# Git permissions
#
# Closed set of roles that may run `git commit` / `git push` in this
# project. Enforced by a pre-commit hook (installed by `greatminds setup`)
# that calls `greatminds check-git-permission commit` and exits non-zero
# when $GREATMINDS_ROLE is not in the allowed list. Forbidden verbs are
# `git` subcommands the project never wants any agent to use (force
# operations, history rewrites). Task 0091 item 2.
# ---------------------------------------------------------------------------
git_permissions:
  commit: [ARCHITECT-REVIEWER]
  push: [ARCHITECT-REVIEWER]
  forbidden_verbs:
    - reset
    - restore
    - checkout
    - stash
    - rebase
    - revert
    - branch
    - tag

# ---------------------------------------------------------------------------
# Tests block — required-field validation for stand_required tasks
#
# When plan.stand_required is true, the tests block MUST contain a
# stand_evidence mapping with the three subfields below. Enforced by
# validate_block in cli/task.py. Task 0091 item 3.
# ---------------------------------------------------------------------------
# 0233: systemic commit-drift fix. STAND-KEEPER deploys the EXACT
# commit the requesting task's impl.base_commit names, not whatever
# main HEAD happens to be at SK-run time. Resolution strategy:
# greatminds stand request looks up evidence_for[0]'s impl block,
# extracts base_commit, and stores it as ``target_commit`` on the
# stand_request file. PROJECT.md's deploy recipe reads
# ``target_commit`` and runs ``git checkout <sha>`` on each host
# before the rsync/compose flow. After stand_result records, SK
# optionally reverts the host to main (post_stand_main_revert).
#
# Pairs with 0229 worktree_fingerprint: 0233 covers committed-state
# identity, 0229 covers uncommitted-overlay identity. Either passing
# proves «stand tested what impl describes».
stand:
  deploy_strategy:
    target_commit_resolution: evidence_for_impl_base_commit
    post_stand_main_revert: true
  # 0243 (0242a / Phase 1 of 0242): stand resource state machine.
  # Singleton resource per project; FIFO lease queue; token-gated
  # access. Replaces the stand_requests/stand_wip/stand_done three-
  # queue model in 1.3.0. Phase 1 ships read-only — schema + state
  # file + status CLI. Mutating CLI lands in 0244.
  resource:
    states: [free, preparing, ready, down]
    transitions:
      - from: free
        to: preparing
        by: STAND-KEEPER
        requires: [active_lease_set]
      - from: preparing
        to: ready
        by: STAND-KEEPER
        requires: [deploy_smoke_ok]
      - from: preparing
        to: down
        by: STAND-KEEPER
        requires: [deploy_failure_logged]
      - from: ready
        to: free
        by: lease_holder_or_stand_keeper_auto
      - from: ready
        to: down
        by: STAND-KEEPER
        requires: [infra_incident_logged]
      - from: down
        to: free
        by: STAND-KEEPER
        requires: [recovery_logged]
    lease:
      ttl_seconds_default: 14400        # 4h
      ttl_warn_window_seconds: 300      # 5min warn before auto-release
      auto_release_on_no_response: true
      # 0271: worktree-path constraint. Stand deploys MUST come from a
      # per-task isolated branch checkout under .worktrees/<seq>; the
      # main fleet tree would self-modify the running host (the very
      # processes we're deploying). Pre-0271 SK's whitelist rejected
      # the wrong path at runtime — leaving TESTER's lease orphaned
      # in preparing/. Now the CLI validates at acquire-time so the
      # mistake never reaches state.yaml.
      worktree_constraint:
        pattern: "{project_dir}/.worktrees/{seq}[-<slug>]"
        description: |
          Resolved worktree path's parent dir must be
          ``<project_dir>/.worktrees`` AND its basename must equal the
          task's seq prefix or start with ``<seq>-`` (the slug variant
          ``git worktree add`` produces by default). The CLI rejects
          any other path — including the project_dir itself — with
          exit_code=2 + a message naming the correct path.
        enforced_by: cli
    queue: fifo
    access_control:
      operations:
        - stand_probe_*: requires holder of active_lease's lease_id
      enforcement_layer: cli
    state_file: .stand/state.yaml       # under coordination/
    # 0244 (0242b / Phase 2): profile enum the lease CLI validates
    # ``--profile`` against. SK's deploy playbook per value lives
    # in PROJECT.md (out of scope for 0244 — separate design).
    profiles_allowed: [full-deploy, vite-dev, smoke-only]

tests_block_validation:
  stand_evidence:
    required_subfields:
      - reproduction_steps
      - observed_without_fix
      - observed_with_fix
    required_when: plan.stand_required
  # 0228: TESTER must run own functional probes against the
  # prepared stand. STAND-KEEPER's observed_with_fix is infra-
  # readiness only (UP, version, /health 200). TESTER's
  # functional_probes + tester_observations are TESTER's own
  # behavior verification, distinct from SK's infra check.
  required_for_scopes:
    backend:
      - functional_probes
      - stand_evidence.tester_observations
    ui:
      - functional_probes
      - stand_evidence.tester_observations
  exempt_scopes:
    - docs        # READER review covers docs
    - research

# ---------------------------------------------------------------------------
# Filesystem layout
#
# Paths relative to <COORDINATION_DIR>. Used by bin/ scripts to locate
# artifacts.
# ---------------------------------------------------------------------------
layout:
  journal: journal.ndjson
  intent_dir: intent/
  inbox_dir: inbox/
  heartbeat_glob: 'heartbeat.*'
  stand_status: stand.status

# ---------------------------------------------------------------------------
# Event-wake dispatch table (task 0186)
#
# coord.yaml's ``tool:`` field per window selects which wake mechanism
# coordd uses for that role on inbox/queue events. Pre-0186 chat-mode
# (claude) roles had no event-wake at all — inbox messages to PLANNER
# / MAINTAINER never auto-triggered a tick. 0186 adds the tmux-send-
# keys mechanism that injects a literal keystroke + Enter into the
# chat-mode pane, identical to operator-typed input.
#
# Mechanisms live as functions in cli/coordd.py
# (sigint_sleeping_descendant, tmux_send_keys_wake). This table maps
# tool → mechanism name; the dispatcher picks the function by name.
# ---------------------------------------------------------------------------
event_wake:
  by_tool:
    codex:  sigint_deepest_descendant   # existing 0150 path
    cursor: sigint_deepest_descendant
    claude: tmux_send_keys              # 0186: chat-mode nudge
  tmux_send_keys:
    keys: "check inbox and continue your tick"
    enter: true
    rate_limit_seconds: 5

# ---------------------------------------------------------------------------
# 0174: FSM single-source-of-truth tables.
#
# Pre-0174 these tables lived as hardcoded constants in cli/task.py:
# STREAM_BLOCK_KINDS, BLOCK_KIND_ROLES, QUEUE_BLOCK_KINDS, IMPL_ROLE_BY_SCOPE,
# PRODUCT_KINDS, PRODUCT_SCOPES, PRIORITIES, PLAN_KINDS, MODES, STAND_*,
# TEST_RESULTS, GATE_CHECK_RESULTS, REVIEW_OUTCOMES, READER_OUTCOMES.
#
# 0174 moves the DATA here; cli/task.py loads + reads at module-import.
# Validator FUNCTION bodies stay in code (registered by name in the
# transitions[*].requires lists). Adding a new block_kind / scope /
# enum value becomes a schema-only edit — no code change needed for
# the data parts.
# ---------------------------------------------------------------------------

# Streams = top-level task categories. Each declares which block kinds
# its tasks may carry + which header fields are required.
streams:
  product:
    allowed_block_kinds:
      [triage, plan, implementation, tests, reader_review, review, blocked, rollback]
    intake_queues: [feature_inbox, user_feedback]
  # 0247 (1.3.0): stand stream removed. The lease-based singleton
  # stand resource replaces the request/wip/done task-file model;
  # see schema.stand.resource for the new state machine.
  review_session:
    allowed_block_kinds: [session_iteration, blocked]
    intake_queues: [review_sessions]

# Block kinds. Each declares which roles may author it + per-block
# enum constraints. `blocked` is special-cased in code (current owner
# of the queue is the only allowed author) and intentionally omits
# `authored_by` here.
block_kinds:
  triage:
    authored_by: [ARCHITECT-PLANNER]
  plan:
    authored_by: [ARCHITECT-PLANNER]
  implementation:
    authored_by: [DEVELOPER, UI-DEVELOPER, TECHNICAL-WRITER]
  tests:
    authored_by: [TESTER]
    allowed_test_results: [pass, fail, partial]
    allowed_gate_check_results: [pass, fail, missing, "n/a"]
  reader_review:
    authored_by: [READER]
    allowed_outcomes: [pass, fail, partial]
  review:
    authored_by: [ARCHITECT-REVIEWER]
    allowed_outcomes: [approved, changes_requested]
  stand_result:
    authored_by: [STAND-KEEPER]
    allowed_results: [ok, partial, fail]
    allowed_statuses: [READY, DEGRADED, DOWN, BLOCKED]
  session_iteration:
    authored_by: [EXPLORER]
  blocked:
    # author = current owner of the queue, resolved at runtime
  # 0195: rollback block — REVIEWER's witdraw/revisit marker for a
  # task already in verified/. Must carry non-empty ``reason:``.
  rollback:
    authored_by: [ARCHITECT-REVIEWER]

# Which block kinds may be appended to a task currently sitting in
# each queue. Terminal queues accept nothing (empty list). Mirrors
# the prior cli/task.py:QUEUE_BLOCK_KINDS hardcode.
queue_accepts_blocks:
  feature_inbox:       [triage, blocked]
  feature_plan:        [plan, blocked]
  feature_dev:         [implementation, blocked]
  feature_ui_dev:      [implementation, blocked]
  feature_docs:        [implementation, blocked]
  feature_test:        [tests, blocked]
  feature_docs_review: [reader_review, blocked]
  feature_review:      [review, blocked]
  feature_blocked:     [blocked]
  user_feedback:       [triage, blocked]
  review_sessions:     [session_iteration, blocked]
  # 0247 (1.3.0): stand_requests/wip/done queue_accepts_blocks
  # entries removed alongside the queues themselves.
  verified:            [rollback]  # 0195: rollback only; terminal otherwise
  archive:             []

# Implementation-block scope → which role's queue feeds it. Used by
# 0134's intake-rejection + 0174's role-of-implementer dispatch.
assignee_role_by_scope:
  backend: DEVELOPER
  ui:      UI-DEVELOPER
  docs:    TECHNICAL-WRITER

# Product-stream enums for validate_header + validate_block.
product_enums:
  kinds:      [feature, bugfix, docs, ops, research, release]
  scopes:     [backend, ui, docs, stand, research, release]
  priorities: [low, normal, high]
  plan_kinds: [full, bugfix]
  modes:      [A, B, C]

# Stand-stream enums.
stand_enums:
  request_types: [deploy, restart, rebuild, smoke, remote_sync, gpu_check, teardown]
  profiles:      [full-deploy, vite-dev]
  results:       [ok, partial, fail]
  statuses:      [READY, DEGRADED, DOWN, BLOCKED]

# ---------------------------------------------------------------------------
# 0185: per-task git worktree policy (replaces 0115/0166 file-locks).
#
# Each task gets its own working tree under <project_dir>/<base_path>/
# <task-id>/ on branch <branch_prefix><task-id>. Implementer agents
# cd into their worktree at claim time. Working-tree contamination
# becomes physically impossible across tasks; no locks needed.
#
# Lifecycle is wired into `greatminds task mv` transitions:
#   * mv → feature_dev / feature_ui_dev / feature_docs  → worktree create
#   * mv → verified by REVIEWER                          → worktree merge
#   * mv → archive                                       → worktree remove
#
# All operator-facing operations are exposed by `greatminds worktree
# {create|remove|merge|list|prune}`.
# ---------------------------------------------------------------------------
worktrees:
  base_path: .worktrees                    # relative to project_dir; gitignored
  branch_prefix: task/                     # task ids become task/<id> branches
  merge_strategy: --no-ff                  # explicit per-task boundary in history
  cleanup_on_archive: true
  cleanup_on_verified: true                # after successful merge
  conflict_handback_to: feature_dev        # where REVIEWER hands back on conflict
  required_for_task_kinds: [feature, bugfix, ops]

# 0175: USER-curated marketplace plugin lists for `greatminds setup`.
# Verified 2026-05-25 against anthropics/claude-plugins-official.
# Codex side deferred — operator hasn't curated yet, empty list per
# role logs deferral and continues.
plugins:
  claude_marketplace:
    ARCHITECT-PLANNER:  [sourcegraph, sentry, huggingface-skills]
    ARCHITECT-REVIEWER: [sourcegraph, sentry]
    DEVELOPER:          [postman]
    UI-DEVELOPER:       [playwright, chrome-devtools-mcp, postman]
    TESTER:             [playwright, sentry, postman, codspeed]
    STAND-KEEPER:       [sentry]
    READER:             []
    MAINTAINER:         []
  codex_marketplace:
    TECHNICAL-WRITER: []
    EXPLORER:         []

# 0193: agent-uttered visual markers.
#
# After each successful greatminds task mv / append-block / inbox
# send, the agent ends its turn-reply with one markdown line per
# the schema-defined template. Unicode colored emoji + markdown
# bold + inline code = TUI (claude / codex / tmux) renders this
# natively — no ANSI escapes (which most TUIs strip). Operator
# scrolling through any agent pane scans by the emoji color and
# spots major lifecycle events without parsing tool-output blocks.
#
# Detection rules (which event for which CLI verb):
#   - task mv → implementer queue from non-claim queue       → claimed
#   - task mv → feature_test / feature_docs_review from
#     an implementer queue                                   → finished
#   - task mv → verified                                     → accepted
#   - task append-block tests --field test_result=fail|partial
#     OR review --field outcome=changes_requested
#     OR mv back to implementer queue from review queue      → rejected
#   - inbox send                                             → message_sent
#
# Templates use Python str.format placeholders. Available context:
# {emoji}, {task_id}, {from_queue}, {to_queue}, {from_role},
# {to_role}, {kind}, {task_ref}, {reason}. Agents pick the right
# placeholders for each event.
visual_events:
  claimed:
    emoji: "🔵"
    template: "{emoji} **CLAIMED** `{task_id}` ({from_queue} → {to_queue})"
  finished:
    emoji: "🟢"
    template: "{emoji} **FINISHED** `{task_id}` → `{to_queue}`"
  accepted:
    emoji: "🟩"
    template: "{emoji} **ACCEPTED** `{task_id}` → `verified`"
  rejected:
    emoji: "🔴"
    template: "{emoji} **REJECTED** `{task_id}` ← {from_role} ({reason})"
  message_sent:
    emoji: "🟣"
    template: "{emoji} **SENT** {kind} → {to_role} {task_ref}"

# 0191: Claude Code auto-mode permissions for claude-host roles.
#
# /loop REVIEWER (and any other claude-host role that needs to run
# destructive git ops) cannot do `git commit/tag/push/merge` without
# an explicit allow rule — Claude Code's auto-mode classifier blocks
# destructive Bash by default, and a /loop session has no operator to
# answer an AskUserQuestion prompt. `greatminds setup` writes/extends
# `<project>/.claude/settings.local.json` with these rules per the
# structured-config-first directive. Operator may extend per-project
# by editing settings.local.json directly; setup merges via union,
# never overwriting existing operator entries.
# 0199: coordd periodic PyPI version check. Every
# `check_interval_seconds`, coordd compares the installed greatminds
# version against PyPI's latest; if newer, it sends ONE info-message
# to `notify_target`. Notify-only — MAINTAINER decides when to
# actually run `greatminds update`. coordd tracks the last-notified
# version in process memory so a still-un-acted-upon newer release
# doesn't spam every poll.
auto_update:
  check_interval_seconds: 14400   # 4h
  notify_target: MAINTAINER
  mode: notify_only               # future: auto_execute
  source: pypi                    # future: git_tag

# 0198: gate `greatminds report-upstream` to MAINTAINER only. Other
# roles file bug-suspects via `greatminds inbox send MAINTAINER
# --kind ask`. CLI refuses for non-allowed agent roles; operator-
# mode (no GREATMINDS_ROLE) bypasses the gate.
report_upstream:
  permissions:
    invoke: [MAINTAINER]
  triage_inbox_target: MAINTAINER
  upstream_repo_required: true

claude_settings:
  permissions:
    allow:
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(git tag:*)"
      - "Bash(git push:*)"
      - "Bash(git merge:*)"
      - "Bash(git worktree:*)"
      - "Bash(git checkout:*)"
      - "Bash(git branch:*)"
      # 0267: REVIEWER's rollback path (verified → revert) needs git
      # revert; TESTER's stand probe needs ssh/scp; STAND-KEEPER's
      # deploy uses rsync. Pre-0267 these were typed manually with `!`
      # prefix on every invocation.
      - "Bash(git revert:*)"
      - "Bash(ssh:*)"
      - "Bash(scp:*)"
      - "Bash(rsync:*)"
  # 0267: classifier auto-mode ceiling. Without explicit auto_mode
  # entries the classifier blocks `git push origin main` even when
  # permissions.allow contains `Bash(git push:*)`. These rules raise
  # the ceiling so REVIEWER's automated cut-and-push pipeline works
  # without manual `!` prefix on each push.
  auto_mode:
    allow:
      - "$defaults"
      - "Bash(git push origin main:*)"
      - "Bash(git push origin main --follow-tags:*)"
      - "Bash(git push --follow-tags:*)"

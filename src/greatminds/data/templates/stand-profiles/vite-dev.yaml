# vite-dev.yaml — REFERENCE profile: LIVE-DEVELOPER rapid UI iteration.
# Brings the backend up once, then leaves a Vite dev server running with HMR
# so the lease HOLDER edits UI in its worktree and sees changes reload live —
# no per-edit redeploy. The dev server stays up across the interactive session.
#
# Host scheme (same as full-deploy.yaml): greatminds is host-agnostic — it
# passes the WHOLE coordination/PROJECT.env (+ lease meta) as --extra-vars, so
# every key is `{{ KEY }}` here. Play 1 registers the stand node(s) from
# `STAND_HOST` (single alias, or comma list) via add_host; Play 2 deploys.
# Override any var (deploy_path / vite_port / ui_dir) from PROJECT.env.
#
# `prerequisite`-tagged tasks are the subset a warmup lease runs.
---
- name: register stand node(s) — control node only, deploys nothing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: add each stand host to the stand_nodes group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: stand_nodes
      loop: >-
        {{ (STAND_HOST | default('localhost')).split(',')
           | map('trim') | reject('equalto', '') | list }}
      tags: [prerequisite]

- name: greatminds vite-dev stand
  hosts: stand_nodes
  gather_facts: false
  become: false
  vars:
    deploy_path: "/srv/greatminds"
    vite_port: "5173"
    ui_dir: "ui"

  tasks:
    - name: detect deploy user
      ansible.builtin.command: whoami
      register: _deploy_user
      changed_when: false
      tags: [prerequisite]
    - name: ensure deploy_path exists (root-created, owned by deploy user)
      become: true
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        owner: "{{ _deploy_user.stdout }}"
        mode: "0755"
      tags: [prerequisite]

    - name: sync worktree to deploy_path (backend + UI source)
      ansible.builtin.command:
        cmd: >
          rsync -aP
          --exclude=.venv*
          --exclude=.worktrees
          --exclude=__pycache__
          --exclude=node_modules
          {{ worktree }}/
          {{ inventory_hostname }}:{{ deploy_path }}/
      delegate_to: localhost
      changed_when: true
      tags: [prerequisite]

    - name: install UI dependencies (idempotent)
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ deploy_path }}/{{ ui_dir }}"
      changed_when: true

    - name: start Vite dev server with HMR (background; stays up across the session)
      # The lease HOLDER (LIVE-DEVELOPER) edits UI in its worktree and
      # Vite's HMR reloads the change live — no redeploy per edit.
      # Idempotent: skip if a dev server is already answering on vite_port.
      ansible.builtin.shell: >
        curl -fsS "http://localhost:{{ vite_port }}/" >/dev/null 2>&1 ||
        nohup npm run dev -- --host --port {{ vite_port }}
        >"/tmp/vite-{{ lease_id | default('dev') }}.log" 2>&1 &
      args:
        chdir: "{{ deploy_path }}/{{ ui_dir }}"
      changed_when: true

    - name: readiness — Vite dev server answers (GET only)
      ansible.builtin.command:
        cmd: curl -fsS "http://localhost:{{ vite_port }}/"
      register: vite_ready
      retries: 5
      delay: 2
      until: vite_ready.rc == 0
      changed_when: false

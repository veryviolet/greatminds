# full-deploy.yaml — STAND-KEEPER's reference playbook for a clean
# deploy of greatminds onto a single remote stand host.
#
# Substitution variables (filled in from lease metadata + PROJECT.env
# at execute_yaml_profile time):
#   - {{ host }}            — target host (also the inventory line)
#   - {{ user }}            — SSH user (inventory line)
#   - {{ deploy_path }}     — remote root, e.g. /srv/greatminds
#   - {{ worktree }}        — local worktree path being deployed
#   - {{ lease_id }} / {{ task_id }} — bookkeeping
#   - Any other key in PROJECT.env flows through as an extra-var.
#
# Tag the prerequisite tasks with `prerequisite` so warmup leases
# (deploy_prerequisites_only=True) run only those steps.
---
- name: greatminds full deploy
  hosts: stand
  gather_facts: false
  become: false
  vars:
    deploy_path: "{{ deploy_path | default('/srv/greatminds') }}"
    expected_version: "{{ expected_version | default('') }}"

  tasks:
    - name: ensure deploy_path exists
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        mode: "0755"
      tags: [prerequisite]

    - name: sync worktree to deploy_path
      # 0284: use plain rsync via ansible.builtin.command so the
      # playbook runs with vanilla ansible-core (the ansible.posix
      # collection is not a hard dep). The delegate_to: localhost
      # runs rsync on the controller and pushes over SSH using the
      # inventory's host/user.
      ansible.builtin.command:
        cmd: >
          rsync -aP
          --exclude=.venv*
          --exclude=.worktrees
          --exclude=__pycache__
          {{ worktree }}/
          {{ ansible_user | default('') }}@{{ inventory_hostname }}:{{ deploy_path }}/
      delegate_to: localhost
      changed_when: true

    - name: ensure uv is on PATH
      ansible.builtin.command: uv --version
      register: uv_check
      changed_when: false
      failed_when: uv_check.rc != 0
      tags: [prerequisite]

    - name: create venv
      ansible.builtin.command:
        cmd: uv venv .venv-coord
        chdir: "{{ deploy_path }}"
        creates: "{{ deploy_path }}/.venv-coord"

    - name: remove stale wheels from dist/ (uv pip refuses ambiguous glob)
      # 0293: ``uv pip install dist/greatminds-*.whl`` refuses to
      # install when the glob matches multiple files (e.g. a
      # previous deploy's wheel still on disk + the freshly-built
      # one). Cleaning ``dist/`` before ``uv build --wheel`` keeps
      # the glob single-result so the install step is deterministic.
      ansible.builtin.shell: rm -f dist/greatminds-*.whl
      args:
        chdir: "{{ deploy_path }}"
      changed_when: true

    - name: build greatminds wheel locally
      ansible.builtin.command:
        cmd: uv build --wheel
        chdir: "{{ deploy_path }}"
      changed_when: true

    - name: install greatminds into venv
      ansible.builtin.command:
        cmd: ".venv-coord/bin/pip install --force-reinstall dist/greatminds-*.whl"
        chdir: "{{ deploy_path }}"
      changed_when: true

    - name: greatminds setup (idempotent)
      ansible.builtin.command:
        cmd: ".venv-coord/bin/greatminds setup --project-dir {{ deploy_path }}"
        chdir: "{{ deploy_path }}"
      register: setup_out
      changed_when: "'written' in setup_out.stdout or 'extended' in setup_out.stdout"

    - name: smoke — greatminds --version reports the expected version
      ansible.builtin.command:
        cmd: ".venv-coord/bin/greatminds --version"
        chdir: "{{ deploy_path }}"
      register: version_out
      changed_when: false
      failed_when:
        - expected_version | length > 0
        - expected_version not in version_out.stdout

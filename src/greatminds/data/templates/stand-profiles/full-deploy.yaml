# full-deploy.yaml — REFERENCE profile: deploy greatminds onto a stand.
#
# greatminds is host-agnostic: it runs `ansible-playbook <this file>` in the
# fleet's coordination dir and hands the WHOLE coordination/PROJECT.env (plus
# lease meta: worktree / task_id / lease_id) to ansible as --extra-vars. So
# every PROJECT.env key is readable here as `{{ KEY }}`. There is NO inventory
# synthesis and NO ${}-substitution — the profile AUTHOR owns host topology by
# ansible-native means.
#
# This example uses `add_host` (dynamic inventory, works for 1 or N nodes):
#   * Play 1 (hosts: localhost) registers the stand node(s) into a
#     `stand_nodes` group from PROJECT.env. Set `STAND_HOST=myhost` (a single
#     ssh-config alias) — or a comma list `STAND_HOST=node-a,node-b` for a
#     multi-node stand. Rename the var freely; it's just this example's choice.
#   * Play 2 (hosts: stand_nodes) runs the deploy natively on each node.
#
# Alternative: ship a static `inventory` (+ `ansible.cfg`) next to your
# profiles and target `hosts: <group>` directly — equally valid, also native.
#
# Tag prerequisite tasks `prerequisite` so warmup leases
# (deploy_prerequisites_only=True) run only those.
---
- name: register stand node(s) — control node only, deploys nothing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: add each stand host to the stand_nodes group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: stand_nodes
        ansible_connection: >-
          {{ 'local' if item in ['localhost', '127.0.0.1', '::1']
             else 'ssh' }}
      loop: >-
        {{ (STAND_HOST | default('localhost')).split(',')
           | map('trim') | reject('equalto', '') | list }}
      tags: [prerequisite]

- name: greatminds full deploy
  hosts: stand_nodes
  gather_facts: false
  become: false
  environment:
    # uv installs to ~/.local/bin; ansible `command:` runs a non-login,
    # non-interactive shell that does NOT source ~/.profile, so ~/.local/bin
    # is not on PATH and `uv` is not found. Add it explicitly. STAND_USER comes
    # from PROJECT.env (--extra-vars); default matches the canon example user.
    PATH: "/home/{{ STAND_USER | default('violet') }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  vars:
    # Literal defaults; a same-named PROJECT.env extra-var overrides them
    # (extra-vars have highest precedence). NOT `{{ deploy_path | default }}`
    # — a self-referential play var recurses.
    deploy_path: "/srv/greatminds"
    expected_version: ""

  tasks:
    - name: detect deploy user
      ansible.builtin.command: whoami
      register: _deploy_user
      changed_when: false
      tags: [prerequisite]
    - name: ensure deploy_path exists (root-created, owned by deploy user)
      become: true
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        owner: "{{ _deploy_user.stdout }}"
        mode: "0755"
      tags: [prerequisite]

    - name: remove stale git metadata from deploy_path
      # --exclude=.git prevents copying the worktree gitdir FILE, but
      # rsync intentionally leaves an excluded destination .git in place. A
      # prior bad deploy can therefore leave /srv/.../.git containing
      # `gitdir: /opt/greatminds/.git/worktrees/...`, making the stand tree a
      # broken git repo and leading roles to normalize "unknown-git-worktree"
      # evidence. Deployed stands are no-git payloads; remove any stale target
      # .git file/dir BEFORE sync so it cannot survive the exclude.
      ansible.builtin.command:
        cmd: rm -rf -- "{{ deploy_path }}/.git"
      changed_when: true

    - name: sync worktree to deploy_path over ssh
      # Plain rsync via command so the playbook needs only ansible-core
      # (no ansible.posix). delegate_to localhost runs rsync on the control
      # node, pushing to the stand node over SSH (its ~/.ssh/config supplies
      # user/key for the bare `{{ inventory_hostname }}` alias).
      #
      # --exclude=.git is REQUIRED: a per-task worktree's `.git` is a
      # `gitdir:` FILE, but a destination from a prior deploy may hold a
      # stale `.git` DIRECTORY. rsync cannot replace a non-empty dir with a
      # regular file and aborts with exit 23 ("cannot delete non-empty
      # directory .git"), bringing the stand DOWN. Deployed stands need no
      # git metadata, so skip it entirely.
      ansible.builtin.command:
        cmd: >
          rsync -aP
          --exclude=.git
          --exclude=.venv*
          --exclude=.worktrees
          --exclude=__pycache__
          {{ worktree }}/
          {{ inventory_hostname }}:{{ deploy_path }}/
      delegate_to: localhost
      when: (ansible_connection | default('ssh')) != 'local'
      changed_when: true

    - name: sync worktree to local deploy_path
      # For STAND_HOST=localhost / loopback the stand is the control node.
      # Do not force rsync through SSH; fresh hosts may not have localhost in
      # known_hosts, and a local copy is the ansible-native topology.
      ansible.builtin.command:
        cmd: >
          rsync -aP
          --exclude=.git
          --exclude=.venv*
          --exclude=.worktrees
          --exclude=__pycache__
          {{ worktree }}/
          {{ deploy_path }}/
      delegate_to: localhost
      when: (ansible_connection | default('ssh')) == 'local'
      changed_when: true

    - name: ensure uv is on PATH
      ansible.builtin.command: uv --version
      register: uv_check
      changed_when: false
      failed_when: uv_check.rc != 0
      tags: [prerequisite]

    - name: create venv
      ansible.builtin.command:
        cmd: uv venv .venv-coord
        chdir: "{{ deploy_path }}"
        creates: "{{ deploy_path }}/.venv-coord"

    - name: remove stale wheels from dist/ (uv pip refuses ambiguous glob)
      ansible.builtin.shell: rm -f dist/greatminds-*.whl
      args:
        chdir: "{{ deploy_path }}"
      changed_when: true

    - name: build greatminds wheel locally
      ansible.builtin.command:
        cmd: uv build --wheel
        chdir: "{{ deploy_path }}"
      changed_when: true

    # Must be `shell`, not `command`: the dist/greatminds-*.whl glob is
    # expanded by the shell. `command` runs no shell, so uv would receive
    # the literal unexpanded path and fail. Mirrors the remove-stale-wheels
    # task above (which builds exactly one wheel, so the glob is unambiguous).
    - name: install greatminds into venv (uv pip — uv venv lacks pip)
      ansible.builtin.shell: >
        uv pip install --python .venv-coord/bin/python
        --force-reinstall dist/greatminds-*.whl
      args:
        chdir: "{{ deploy_path }}"
      changed_when: true

    - name: greatminds setup (idempotent)
      ansible.builtin.command:
        cmd: ".venv-coord/bin/greatminds setup --project-dir {{ deploy_path }}"
        chdir: "{{ deploy_path }}"
      register: setup_out
      changed_when: "'written' in setup_out.stdout or 'extended' in setup_out.stdout"

    - name: smoke — greatminds --version reports the expected version
      ansible.builtin.command:
        cmd: ".venv-coord/bin/greatminds --version"
        chdir: "{{ deploy_path }}"
      register: version_out
      changed_when: false
      failed_when:
        - expected_version | length > 0
        - expected_version not in version_out.stdout

# smoke-only.yaml — REFERENCE profile: fast reachability + CLI-responds
# probe. No rsync, no install. Used for warmup leases and post-deploy
# liveness checks.
#
# Host scheme (same as full-deploy.yaml): greatminds passes the WHOLE
# .greatminds/PROJECT.env as --extra-vars; Play 1 registers the stand
# node(s) from `STAND_HOST` (single alias, or comma list) via add_host;
# Play 2 probes each.
---
- name: register stand node(s) — control node only
  hosts: localhost
  gather_facts: false
  tasks:
    - name: add each stand host to the stand_nodes group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: stand_nodes
        ansible_connection: >-
          {{ 'local' if item in ['localhost', '127.0.0.1', '::1']
             else 'ssh' }}
      loop: >-
        {{ (STAND_HOST | default('localhost')).split(',')
           | map('trim') | reject('equalto', '') | list }}
      tags: [prerequisite]

- name: greatminds smoke
  hosts: stand_nodes
  gather_facts: false
  become: false
  environment:
    # uv installs to ~/.local/bin; ansible `command:` runs a non-login,
    # non-interactive shell that does NOT source ~/.profile, so ~/.local/bin
    # is not on PATH. Mirror full-deploy's PATH block so any uv-dependent
    # probe added here resolves uv on freshly seeded fleets. STAND_USER comes
    # from PROJECT.env (--extra-vars); default matches the canon example user.
    PATH: "/home/{{ STAND_USER | default('violet') }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  vars:
    deploy_path: "/srv/greatminds"

  tasks:
    - name: ssh reachable + remote shell working
      ansible.builtin.command: /bin/true
      changed_when: false
      tags: [prerequisite]

    - name: greatminds CLI responds
      ansible.builtin.command:
        cmd: ".venv/bin/greatminds --version"
        chdir: "{{ deploy_path }}"
      register: version_out
      changed_when: false
      failed_when: version_out.rc != 0
